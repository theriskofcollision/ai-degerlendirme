<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Otomasyon Değerlendirmesi / AI Automation Assessment</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1a1a18; --muted:#6b6a64;
    --accent:#c96442; --accent-soft:#f3d9cf; --green:#3d7a4f; --green-soft:#dcefe2;
    --amber:#b07b1e; --amber-soft:#f6ead2; --gray-soft:#e8e7e2; --blue:#3b6ea5; --blue-soft:#dde8f3;
    --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
  header.app{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .brand{font-weight:700;font-size:15px;letter-spacing:.2px}
  .brand span{color:var(--accent)}
  .langtoggle{display:flex;gap:4px;background:var(--gray-soft);border-radius:99px;padding:3px}
  .langtoggle button{border:none;background:transparent;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
  .langtoggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .progress{height:6px;background:var(--gray-soft);border-radius:99px;overflow:hidden;margin-bottom:26px}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 28px;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
  h1{font-size:26px;line-height:1.25;margin-bottom:12px;font-weight:750}
  h2{font-size:21px;line-height:1.3;margin-bottom:10px;font-weight:700}
  p.sub{color:var(--muted);font-size:15px;margin-bottom:20px}
  .hint{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--gray-soft);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--card);text-align:left;font-size:15px;transition:border-color .15s, background .15s;width:100%}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .dot{flex:0 0 18px;height:18px;border:2px solid #c9c8c1;border-radius:50%;margin-top:2px}
  .opt.sel .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3.5px var(--accent-soft)}
  .opt b{display:block;font-size:15px}
  .opt small{color:var(--muted);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{border:1.5px solid var(--gray-soft);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer}
  .chip.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  input[type=text],input[type=email]{width:100%;border:1.5px solid var(--gray-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:12px;background:var(--card);color:var(--ink)}
  textarea{width:100%;border:1.5px solid var(--gray-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:12px;background:var(--card);color:var(--ink);font-family:inherit;resize:vertical;min-height:64px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label.fl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
  .btnrow{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
  .btn{border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:650;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--muted);padding:12px 10px}
  .btn.accent{background:var(--accent);color:#fff}
  .tasklist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .taskrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 14px;font-size:15px}
  .taskrow span{flex:1}
  .taskrow button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px}
  .addrow{display:flex;gap:8px;margin-bottom:16px}
  .addrow input{margin-bottom:0}
  .addrow .btn{white-space:nowrap}
  .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 12px;margin-bottom:6px}
  .tag.g{background:var(--green-soft);color:var(--green)}
  .tag.a{background:var(--amber-soft);color:var(--amber)}
  .tag.r{background:var(--gray-soft);color:var(--muted)}
  .tag.b{background:var(--blue-soft);color:var(--blue)}
  .rescard{border:1.5px solid var(--gray-soft);border-radius:12px;padding:18px;margin-bottom:14px;background:var(--card)}
  .rescard.top{border-color:var(--accent);box-shadow:var(--shadow)}
  .reshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .reshead h3{font-size:16px;flex:1}
  .score{font-size:22px;font-weight:800}
  .score small{font-size:12px;color:var(--muted);font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .bar .tr{height:7px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
  .bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .dilig{margin-top:12px;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13.5px}
  .dilig b{display:block;margin-bottom:4px;font-size:13px}
  .dilig ul{margin:0 0 0 18px}
  .dilig li{margin-bottom:3px}
  .callout{background:var(--accent-soft);border-radius:12px;padding:18px;margin-bottom:22px}
  .callout h3{font-size:15px;margin-bottom:6px}
  .callout p{font-size:14px}
  .statement{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 16px;font-size:14px;margin:14px 0 20px;white-space:pre-line}
  .foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .foot a{color:var(--accent)}
  .stepnote{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .skiplink{font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none}
  @media print{
    body{background:#fff}
    .wrap{max-width:100%;padding:0}
    header.app,.progress,.btnrow,.noprint{display:none!important}
    .card{box-shadow:none;padding:0}
    .rescard{break-inside:avoid}
  }
</style>
</head>

<div class="wrap">
  <header class="app">
    <div class="brand">AI<span>·</span>Readiness</div>
    <div class="langtoggle">
      <button id="btn-tr" onclick="setLang('tr')">TR</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>

  <div class="progress noprint"><i id="pbar" style="width:2%"></i></div>
  <main id="app"></main>
  <div class="foot noprint" id="foot"></div>
</div>

function t(k){ return T[S.lang][k]; }
function fmt(s, vars){ return s.replace(/\{(\w+)\}/g,(_,k)=>vars[k]!==undefined?vars[k]:"{"+k+"}"); }

const app = document.getElementById("app");
const SCORE_QS = ["A","B","C","D","cons","E","F","G"]; // per-task question order (deleg comes first)

function setLang(l){ S.lang = l; save(); render(); }
function go(screen){ S.screen = screen; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function progressPct(){
  const order = {welcome:2, biz:8, discovery:15, review:30, scoring:35, lead:88, results:100};
  let base = order[S.screen] || 2;
  if (S.screen === "discovery") base = 12 + S.discoveryIdx * 4;
  if (S.screen === "scoring" && S.tasks.length){
    const perTask = 55 / S.tasks.length;
    base = 32 + S.taskIdx * perTask + (S.qIdx / (SCORE_QS.length+1)) * perTask;
  }
  return Math.min(100, base);
}

function render(){
  document.getElementById("btn-tr").className = S.lang==="tr" ? "on" : "";
  document.getElementById("btn-en").className = S.lang==="en" ? "on" : "";
  document.getElementById("pbar").style.width = progressPct() + "%";
  document.getElementById("foot").textContent = t("foot");
  const fns = {welcome:rWelcome, biz:rBiz, discovery:rDiscovery, review:rReview, scoring:rScoring, lowimpact:rLowImpact, lead:rLead, results:rResults};
  app.innerHTML = "";
  fns[S.screen]();
  save();
}

function card(html){ const d=document.createElement("div"); d.className="card"; d.innerHTML=html; app.appendChild(d); return d; }

/* keyword map: matches a free-text business description to the closest sector pool */
const SECTOR_KEYWORDS = {
  retail:["satış","mağaza","dükkan","dukkan","perakende","butik","market","e-tic","eticaret","shop","store","retail","ecommerce","e-commerce","boutique","sell"],
  food:["restoran","kafe","cafe","lokanta","yemek","pastane","fırın","firin","büfe","bufe","catering","restaurant","food","bakery","coffee","bar","bistro"],
  services:["kuaför","kuafor","berber","temizlik","tamir","tamirci","servis","bakım","bakim","güzellik","guzellik","salon","spa","fitness","emlak","fotoğraf","fotograf","nakliyat","oto","repair","cleaning","maintenance","barber","photo","real estate","moving","salon"],
  mfg:["üretim","uretim","imalat","fabrika","atölye","atolye","tekstil","mobilya","metal","plastik","manufact","factory","production","workshop","textile","furniture"],
  prof:["muhasebe","hukuk","avukat","danışman","danisman","ajans","yazılım","yazilim","tasarım","tasarim","mimar","mühendis","muhendis","sigorta","eğitim","egitim","kurs","accounting","legal","law","consult","agency","software","design","architect","engineer","marketing","insurance","education","training"]
};
function matchSector(txt){
  txt = (txt||"").toLowerCase();
  for (const [sec, words] of Object.entries(SECTOR_KEYWORDS)){
    if (words.some(w=>txt.includes(w))) return sec;
  }
  return "other";
}
function suggestionsFor(){
  let sec = S.biz.sector || "other";
  if (sec==="other" && S.biz.sectorText) sec = matchSector(S.biz.sectorText);
  return t("tasks_by_sector")[sec] || t("tasks_by_sector").other;
}
function hasTask(name){ return S.tasks.some(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase()); }
function addTask(name){
  name = name.trim(); if(!name || hasTask(name)) return;
  S.tasks.push({name, delegation:null, scores:{}, cons:null, parked:false, humanLed:false});
}

/* --- scoring flow: qIdx -1 = delegation, then SCORE_QS by index --- */
function currentTask(){ return S.tasks[S.taskIdx]; }
function nextTaskOrLead(){
  if (S.taskIdx < S.tasks.length-1){ S.taskIdx++; S.qIdx=-1; go("scoring"); }
  else go("lead");
}
function impactOf(task){ return (task.scores.A||0)+(task.scores.B||0)+(task.scores.C||0)+(task.scores.D||0); }

function rScoring(){
  const task = currentTask();
  if (!task){ go("lead"); return; }
  const kicker = fmt(t("score_kicker"),{n:S.taskIdx+1,total:S.tasks.length}) + " · " + esc(task.name);

  if (S.qIdx === -1){ // delegation question
    const opts = t("q_deleg_opts").map(([v,l,d])=>`
      <button class="opt ${task.delegation===v?"sel":""}" data-v="${v}">
        <span class="dot"></span><span><b>${l}</b><small>${d}</small></span>
      </button>`).join("");
    const c = card(`
      <div class="kicker">${kicker}</div>
      <h2>${fmt(t("q_deleg"),{task:esc(task.name)})}</h2>
      <div class="hint">💡 ${t("q_deleg_hint")}</div>
      <div class="opts">${opts}</div>
      <div class="btnrow"><button class="btn ghost" id="s-back">← ${t("back")}</button><span></span></div>
    `);
    c.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
      task.delegation = b.dataset.v;
      if (b.dataset.v === "human"){
        task.humanLed = true; task.parked=false;
        b.classList.add("sel");
        setTimeout(nextTaskOrLead, 350);
      } else {
        task.humanLed = false;
        S.qIdx = 0; render();
      }
    });
    c.querySelector("#s-back").onclick=()=>{
      if (S.taskIdx>0){ S.taskIdx--; S.qIdx = SCORE_QS.length-1; render(); }
      else go("review");
    };
    return;
  }

  const key = SCORE_QS[S.qIdx];
  const qkey = "q_"+key, okey = "q_"+key+"_opts";
  const hint = (key==="cons") ? t("q_cons_hint") : (key==="G") ? t("q_G_hint") : (key==="deleg") ? t("q_deleg_hint") : null;
  const cur = (key==="cons") ? task.cons : task.scores[key];
  const opts = t(okey).map(o=>{
    const v=o[0], l=o[1], d=o[2];
    return `<button class="opt ${String(cur)===String(v)?"sel":""}" data-v="${v}">
      <span class="dot"></span><span><b>${l}</b>${d?`<small>${d}</small>`:""}</span></button>`;
  }).join("");
  const c = card(`
    <div class="kicker">${kicker}</div>
    <h2>${t(qkey)}</h2>
    ${hint?`<div class="hint">💡 ${hint}</div>`:""}
    <div class="opts">${opts}</div>
    <div class="btnrow"><button class="btn ghost" id="s-back">← ${t("back")}</button><span></span></div>
  `);
  c.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if (key==="cons") task.cons=v; else task.scores[key]=+v;
    b.classList.add("sel");
    setTimeout(()=>{
      // branching: after D, if impact very low → offer to park
      if (key==="D" && impactOf(task) <= 8 && !task._lowAsked){
        task._lowAsked = true; go("lowimpact"); return;
      }
      if (S.qIdx < SCORE_QS.length-1){ S.qIdx++; render(); }
      else { task.parked=false; nextTaskOrLead(); }
    }, 250);
  });
  c.querySelector("#s-back").onclick=()=>{ S.qIdx--; render(); };
}

function rLowImpact(){
  const task = currentTask();
  const c = card(`
    <div class="kicker">${esc(task.name)}</div>
    <h2>${t("lowimpact_h")}</h2>
    <p class="sub">${t("lowimpact_p")}</p>
    <div class="opts">
      <button class="opt" id="park"><span class="dot"></span><span><b>${t("lowimpact_park")}</b></span></button>
      <button class="opt" id="cont"><span class="dot"></span><span><b>${t("lowimpact_cont")}</b></span></button>
    </div>
  `);
  c.querySelector("#park").onclick=()=>{ task.parked=true; nextTaskOrLead(); };
  c.querySelector("#cont").onclick=()=>{ S.qIdx++; go("scoring"); };
}

function rLead(){
  const c = card(`
    <div class="kicker">${t("lead_kicker")}</div>
    <h2>${t("lead_h")}</h2>
    <p class="sub">${t("lead_p")}</p>
    <label class="fl">${t("lead_name")}</label>
    <input type="text" id="ln" value="${esc(S.lead.name)}">
    <label class="fl">${t("lead_email")}</label>
    <input type="email" id="le" value="${esc(S.lead.email)}">

  const done = ()=>go("results");
  c.querySelector("#lgo").onclick=()=>{

    if(!S.lead.email){ c.querySelector("#le").style.borderColor="var(--accent)"; c.querySelector("#le").focus(); return; }
    if (WEBHOOK_URL){
      try{ fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lead:S.lead,biz:S.biz,results:resultRows()})}); }catch(e){}
    }
    done();
  };
  c.querySelector("#lskip").onclick=done;
}

/* ================= RESULTS ================= */
function totalOf(x){ return impactOf(x)+(x.scores.E||0)+(x.scores.F||0)+(x.scores.G||0); }
function feasOf(x){ return (x.scores.E||0)+(x.scores.F||0); }
function badgeOf(x){
  if (x.humanLed) return ["b", t("badge_human")];
  if (x.parked) return ["r", t("badge_parked")];
  const tot = totalOf(x);
  if (tot>=28) return ["g", t("badge_ready")];
  if (tot>=22) return ["a", t("badge_strong")];
  return ["r", t("badge_improve")];
}
function resultRows(){
  return S.tasks.map(x=>({name:x.name, humanLed:x.humanLed, parked:x.parked, total:totalOf(x), impact:impactOf(x), feas:feasOf(x), ease:x.scores.G||0, cons:x.cons, delegation:x.delegation}));
}

function buildMailBody(scored, humans, parked, bizName, top){
  const L = [];
  const secLabel = (t("sectors").find(s=>s[0]===S.biz.sector)||["",""])[1] + (S.biz.sectorText ? " — " + S.biz.sectorText : "");
  L.push("=== " + t("res_kicker") + " ===");
  L.push(t("mail_date") + ": " + new Date().toLocaleDateString(S.lang==="tr"?"tr-TR":"en-US",{year:"numeric",month:"long",day:"numeric"}));
  L.push(t("mail_biz") + ": " + bizName + " · " + secLabel + " · " + (S.biz.size||"?"));
  if (S.lead.name || S.lead.email || S.lead.company){
    L.push(t("mail_contact") + ": " + [S.lead.name, S.lead.email, S.lead.company].filter(Boolean).join(" · "));
  }
  L.push("");
  if (top) L.push("🎯 " + fmt(t("res_top_h"),{task:top.name}) + " — " + totalOf(top) + "/35");
  L.push("");
  scored.forEach((x,i)=>{
    L.push((i+1) + ". " + x.name + " — " + totalOf(x) + "/35 [" + badgeOf(x)[1] + "]");
    L.push("   " + t("bar_impact") + ": " + impactOf(x) + "/20 · " + t("bar_feas") + ": " + feasOf(x) + "/10 · " + t("bar_ease") + ": " + (x.scores.G||0) + "/5");
    L.push("   " + (x.delegation==="assist" ? t("mode_assist") : t("mode_auto")));
  });
  let n = scored.length;
  humans.forEach(x=>{ L.push((++n) + ". " + x.name + " — " + t("badge_human")); });
  parked.forEach(x=>{ L.push((++n) + ". " + x.name + " — " + t("badge_parked")); });
  if (top){
    const review = top.cons==="high" ? t("stmt_review_high") : top.cons==="mid" ? t("stmt_review_mid") : t("stmt_review_low");
    const mode = top.delegation==="assist" ? t("stmt_mode_assist") : t("stmt_mode_auto");
    L.push("");
    L.push("--- " + t("stmt_h") + " ---");
    L.push(fmt(t("stmt_body"),{biz:bizName,task:top.name,mode,impact:impactOf(top),feas:feasOf(top),review}));
  }
  return L.join("\n");
}

/* PILOT: sends the full assessment (and feedback, when given) to the Formspree endpoint */
function sendPilotData(stage){
  if (!WEBHOOK_URL) return;
  const scored = S.tasks.filter(x=>!x.humanLed && !x.parked).sort((a,b)=>totalOf(b)-totalOf(a));
  const humans = S.tasks.filter(x=>x.humanLed);
  const parked = S.tasks.filter(x=>x.parked && !x.humanLed);
  const bizName = S.biz.name || "-";
  const payload = {
    _subject: "[AI Pilot] " + bizName + " (" + stage + ")",
    stage, lang: S.lang, date: new Date().toISOString(),
    name: S.lead.name || "", email: S.lead.email || "",
    business: bizName,
    sector: (S.biz.sector||"") + (S.biz.sectorText ? " — " + S.biz.sectorText : ""),
    team_size: S.biz.size || "",
    top_task: scored[0] ? scored[0].name + " (" + totalOf(scored[0]) + "/35)" : "",
    useful: fb().useful || "", would_consult: fb().consult || "",
    confusing: fb().confusing || "", comment: fb().comment || "",
    report: buildMailBody(scored, humans, parked, bizName, scored[0])
  };
  try{
    fetch(WEBHOOK_URL, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify(payload)});
  }catch(e){}
}

/* builds a self-contained HTML report file and downloads it, so the user can attach it to the email */
function downloadReport(bizName){
  const node = document.querySelector("#app .card");
  if (!node) return;
  const clone = node.cloneNode(true);
  clone.querySelectorAll(".noprint").forEach(e=>e.remove());
  const css = document.querySelector("style").innerHTML;
  const html = `<!DOCTYPE html>
<html lang="${S.lang}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(t("res_kicker"))} · ${esc(bizName)}</title><style>${css}
body{padding:24px 16px}</style></head>
<body><div class="wrap">${clone.outerHTML}
<div class="foot">${esc(t("foot"))}</div></div></body></html>`;
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const safe = (bizName||"rapor").replace(/[^\wşŞıİğĞüÜöÖçÇ-]+/g,"-").replace(/^-+|-+$/g,"") || "rapor";
  a.download = (S.lang==="tr" ? "AI-degerlendirme-raporu-" : "AI-assessment-report-") + safe + ".html";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function rResults(){
  if (WEBHOOK_URL && !S._resultsSent){ S._resultsSent = true; save(); sendPilotData("results"); }
  const scored = S.tasks.filter(x=>!x.humanLed && !x.parked).sort((a,b)=>totalOf(b)-totalOf(a));
  const humans = S.tasks.filter(x=>x.humanLed);
  const parked = S.tasks.filter(x=>x.parked && !x.humanLed);
  const improve = scored.filter(x=>totalOf(x)<22);
  const top = scored[0];
  const bizName = S.biz.name || (S.lang==="tr"?"işletmeniz":"your business");

  let topHtml = "";
  let stmtHtml = "";
  if (top){
    const review = top.cons==="high" ? t("stmt_review_high") : top.cons==="mid" ? t("stmt_review_mid") : t("stmt_review_low");
    const mode = top.delegation==="assist" ? t("stmt_mode_assist") : t("stmt_mode_auto");
    topHtml = `<div class="callout">
      <h3>🎯 ${fmt(t("res_top_h"),{task:esc(top.name)})}</h3>
      <p>${fmt(t("res_top_p"),{score:totalOf(top)})}</p>
    </div>`;
    stmtHtml = `<h2 style="font-size:17px;margin-top:26px">${t("stmt_h")}</h2>
      <div class="statement">${esc(fmt(t("stmt_body"),{biz:bizName,task:top.name,mode,impact:impactOf(top),feas:feasOf(top),review}))}</div>`;
  }

  const cards = scored.map((x,ix)=>{
    const [cls,label] = badgeOf(x);
    const dil = x.cons==="high" ? t("dilig_high") : x.cons==="mid" ? t("dilig_mid") : t("dilig_low");
    const modeTag = x.delegation==="assist" ? `<span class="tag a">${t("mode_assist")}</span>` : `<span class="tag g">${t("mode_auto")}</span>`;
    return `<div class="rescard ${ix===0?"top":""}">
      <span class="tag ${cls}">${label}</span> ${modeTag}
      <div class="reshead"><h3>${ix+1}. ${esc(x.name)}</h3><div class="score">${totalOf(x)}<small>/35 ${t("score_word")}</small></div></div>
      <div class="bars">
        <div class="bar"><span>${t("bar_impact")}</span><span class="tr"><i style="width:${impactOf(x)/20*100}%"></i></span><span>${impactOf(x)}/20</span></div>
        <div class="bar"><span>${t("bar_feas")}</span><span class="tr"><i style="width:${feasOf(x)/10*100}%"></i></span><span>${feasOf(x)}/10</span></div>
        <div class="bar"><span>${t("bar_ease")}</span><span class="tr"><i style="width:${(x.scores.G||0)/5*100}%"></i></span><span>${x.scores.G||0}/5</span></div>
      </div>
      ${ix<3?`<div class="dilig"><b>✅ ${t("dilig_h")}</b><ul>${dil.map(d=>`<li>${d}</li>`).join("")}</ul><div style="margin-top:6px">${t("dilig_trans")}</div></div>`:""}
    </div>`;
  }).join("");

  const improveHtml = improve.length ? `<div class="hint" style="margin-top:8px">🛠 ${t("improve_note")}</div>` : "";
  // numbering continues across sections so nothing looks "missing" (scored 1..n, then human, then parked)
  let seq = scored.length;
  const humanHtml = humans.length ? `
    <h2 style="font-size:17px;margin-top:26px">${t("badge_human")}</h2>
    <div class="hint">🤝 ${t("human_note")}</div>
    ${humans.map(x=>`<div class="taskrow"><span>${++seq}. ${esc(x.name)}</span><span class="tag b">${t("badge_human")}</span></div>`).join("")}` : "";
  const parkedHtml = parked.length ? `
    <div style="margin-top:16px">${parked.map(x=>`<div class="taskrow"><span>${++seq}. ${esc(x.name)}</span><span class="tag r">${t("badge_parked")}</span></div>`).join("")}</div>` : "";

  const mailBody = encodeURIComponent(t("mail_attach_note") + "\n\n" + buildMailBody(scored, humans, parked, bizName, top));
  const mailtoUrl = `mailto:${CONSULTANT_EMAIL}?subject=${encodeURIComponent(t("mail_subject"))}&body=${mailBody}`;

  const c = card(`
    <div class="kicker">${t("res_kicker")}</div>
    <h1 style="font-size:22px">${fmt(t("res_h"),{biz:esc(bizName)})}</h1>
    <p class="sub">${new Date().toLocaleDateString(S.lang==="tr"?"tr-TR":"en-US",{year:"numeric",month:"long",day:"numeric"})}</p>
    ${topHtml}
    ${cards}
    ${improveHtml}
    ${humanHtml}
    ${parkedHtml}
    ${stmtHtml}
    <div class="callout noprint" style="margin-top:24px">
      <h3>${t("cta_h")}</h3>
      <p>${t("cta_p")}</p>
      <div class="btnrow" style="justify-content:flex-start;margin-top:12px;flex-wrap:wrap">
        <button class="btn accent" id="sendmail">${t("cta_mail")}</button>
        <button class="btn primary" onclick="window.print()">${t("cta_print")}</button>
        <button class="btn ghost" id="restart">${t("cta_restart")}</button>
      </div>
      <div class="stepnote" style="margin-top:10px;margin-bottom:0">${t("cta_mail_hint")}</div>
    </div>
    ${fb().sent ? `
    <div class="callout noprint" style="background:var(--blue-soft)">
      <h3>${t("fb_thanks")}</h3>
      <p>${t("fb_thanks_p")}</p>
    </div>` : `
    <div class="callout noprint" style="background:var(--blue-soft)">
      <h3>${t("fb_h")}</h3>
      <p style="margin-bottom:14px">${t("fb_p")}</p>
      <label class="fl">${t("fb_useful")}</label>
      <div class="chips">${t("fb_useful_opts").map(([v,l])=>`<button class="chip ${fb().useful===v?"sel":""}" data-fbu="${v}">${l}</button>`).join("")}</div>
      <label class="fl">${t("fb_consult")}</label>
      <div class="chips">${t("fb_consult_opts").map(([v,l])=>`<button class="chip ${fb().consult===v?"sel":""}" data-fbc="${v}">${l}</button>`).join("")}</div>
      <label class="fl">${t("fb_confusing")}</label>
      <textarea id="fbconf" placeholder="${t("fb_confusing_ph")}">${esc(fb().confusing)}</textarea>
      <label class="fl">${t("fb_comment")}</label>
      <textarea id="fbcom" placeholder="${t("fb_comment_ph")}">${esc(fb().comment)}</textarea>
      <div class="btnrow" style="justify-content:flex-end">
        <button class="btn primary" id="fbsend">${t("fb_send")}</button>
      </div>
    </div>`}
  `);
  if (!fb().sent){
    const grab = ()=>{
      const a=c.querySelector("#fbconf"), b=c.querySelector("#fbcom");
      if(a) fb().confusing=a.value; if(b) fb().comment=b.value; save();
    };
    c.querySelectorAll("[data-fbu]").forEach(b=>b.onclick=()=>{ grab(); fb().useful=b.dataset.fbu; render(); });
    c.querySelectorAll("[data-fbc]").forEach(b=>b.onclick=()=>{ grab(); fb().consult=b.dataset.fbc; render(); });
    c.querySelector("#fbsend").onclick=()=>{ grab(); sendPilotData("feedback"); fb().sent=true; save(); render(); };
  }
  c.querySelector("#sendmail").onclick=()=>{
    downloadReport(bizName);
    setTimeout(()=>{ window.location.href = mailtoUrl; }, 500);
  };
  c.querySelector("#restart").onclick=()=>{
    try{ localStorage.removeItem("aiassess_v3"); }catch(e){}
    S={lang:S.lang,biz:{name:"",sector:null,sectorText:"",size:null},tasks:[],discoveryIdx:0,taskIdx:0,qIdx:0,lead:{name:"",email:"",company:""},feedback:{useful:null,consult:null,confusing:"",comment:"",sent:false},screen:"welcome"};
    render();
  };
}

render();
</script>
